server {
    listen 80;
    listen [::]:80;
    server_name localhost ecomti.com.br www.ecomti.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # Otimização de envio de arquivos e compressão Gzip
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. HTML Principal: NUNCA armazenar em cache para garantir atualização imediata
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2. PWA e Service Worker: Sem cache para atualizações instantâneas
    location ~* (sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        access_log off;
    }

    # 3. Assets estáticos versionados: Cache longo e imutável (1 ano)
    location ~* ^/(assets|lovable-uploads)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. Imagens estáticas, favicons e fontes
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, max-age=15552000, immutable";
        access_log off;
    }

    # 5. Roteamento SPA Resiliente: qualquer rota desconhecida serve o index.html sem cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Página de fallback para erros 404 mantendo o SPA
    error_page 404 /index.html;
}
