  </head>

  <body>
    <div id="root"></div>

    <!-- Registro Seguro do Service Worker (PWA com Auto-Update) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('[PWA] Service Worker registrado no escopo:', registration.scope);

            // Verifica se há uma nova versão em background
            registration.onupdatefound = () => {
              const installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] Nova versão detectada. Atualizando página...');
                    window.location.reload();
                  }
                };
              }
            };
          }).catch((error) => {
            console.error('[PWA] Erro ao registrar Service Worker:', error);
          });
        });
      }
    </script>
  </body>
